[build]
  # Directory to change to before starting a build
  base = "."
  
  # Directory that contains the deploy-ready HTML files and assets generated by the build
  publish = "dist"
  
  # Default build command
  command = "npm run build"

[build.environment]
  # Set Node.js version for the build
  NODE_VERSION = "18"

[functions]
  # Directory where your Netlify Functions are located
  directory = "netlify/functions"
  # Set Node.js version for functions
  node_bundler = "esbuild"
  # Include .ts files
  included_files = ["netlify/functions/**/*.ts"]

[[headers]]
  # Define which paths this specific [[headers]] block will cover
  for = "/*"
  
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache static assets for 1 year
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Don't cache the main HTML file
  for = "/index.html"
  
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Handle form submissions (if you have any contact forms)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200