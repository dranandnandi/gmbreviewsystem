[build]
  # Directory to change to before starting a build
  base = "."
  
  # Directory that contains the deploy-ready HTML files and assets generated by the build
  publish = "dist"
  
  # Default build command
  command = "npm run build"

[build.environment]
  # Set Node.js version for the build
  NODE_VERSION = "18"

[functions]
  # Directory where your Netlify Functions are located
  directory = "netlify/functions"
  # Set Node.js version for functions
  node_bundler = "esbuild"
  # Include .ts files
  included_files = ["netlify/functions/**/*.ts"]

[[headers]]
  # Cache generated static assets for 1 year
  for = "/assets/*"
  
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache static assets for 1 year
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Don't cache the main HTML file
  for = "/index.html"
  
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CCAvenue payment callback: proxy through our registered domain (limsapp.in)
# to the Supabase edge function, so CCAvenue only sees the domain its keys are
# registered for. Must come before the generic /api/* rule (first match wins).
[[redirects]]
  from = "/api/ccavenue-callback"
  to = "https://iksfxkjnslttufpdklgq.supabase.co/functions/v1/ccavenue-callback"
  status = 200
  force = true

# Handle form submissions (if you have any contact forms)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-page app fallback for direct route access like /sequence-flow
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
