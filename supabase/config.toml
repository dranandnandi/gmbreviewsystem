# Supabase project configuration
# Per-function settings for Edge Functions.
#
# ccavenue-callback and ccavenue-reconcile must NOT require a Supabase JWT:
# - ccavenue-callback is POSTed to directly by CCAvenue's servers (no auth header)
# - ccavenue-reconcile is triggered by an external cron and protected by CRON_SECRET instead

project_id = "iksfxkjnslttufpdklgq"

[functions.ccavenue-initiate]
verify_jwt = true

# Guest checkout is called with the public anon key (no user session yet)
[functions.ccavenue-guest-checkout]
verify_jwt = true

[functions.ccavenue-callback]
verify_jwt = false

[functions.ccavenue-reconcile]
verify_jwt = false
